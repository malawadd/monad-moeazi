[profile.default]
src = "src"
test = "test"
out = "out"
cache_path = "cache"
solc_version = "0.8.26"
evm_version = "cancun"
optimizer = true
optimizer_runs = 20_000
libs = ["../../execution-sidecar/node_modules"]
remappings = [
  "@uniswap/v4-core/=../../execution-sidecar/node_modules/@uniswap/v4-core/",
  "@uniswap/v4-periphery/=../../execution-sidecar/node_modules/@uniswap/v4-periphery/"
]

